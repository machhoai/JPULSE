name: Production CI (GCloud)

on:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint employee contract rollout
        run: pnpm run lint:employee-contracts

      - name: Typecheck
        run: pnpm --filter @bduck/shared-types build && pnpm run typecheck

      - name: Verify attendance Shortcut API
        run: |
          pnpm --filter @bduck/be-wms exec tsx --test src/services/attendanceShortcutPolicy.test.ts src/services/attendanceAuthorizationPolicy.test.ts src/services/attendanceLocationPolicy.test.ts
          pnpm --filter @bduck/be-wms build
          node --experimental-test-module-mocks --test apps/be-wms/test/attendance-shortcut-api.test.mjs

      # Releases use Cloud Build / Artifact Registry / Cloud Run.
      # See docs/deployment-cicd.md; GitHub Actions does not publish GHCR images.
